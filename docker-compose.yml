version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: collection-tracker-app
        volumes:
            - .:/var/www/html
        networks:
            - app-network

    web:
        image: nginx:alpine
        container_name: collection-tracker-web
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - /var/www/html/node_modules
        depends_on:
            - app
        networks:
            - app-network

    db:
        image: mysql:8.0
        container_name: mysql-db
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    mysql_data:
